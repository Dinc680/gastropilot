<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GastroPilot – Mengenrechner</title>

<style>
*{box-sizing:border-box}

:root{
  --green:#135847;
  --green2:#22866f;
  --bg:#f1f3f2;
  --text:#202020;
  --muted:#777;
  --border:#cfcfcf;
  --blue:#59aef0;
  --danger:#b53a3a;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:var(--green);
  color:white;
  padding:28px 36px 36px;
}

header h1{
  margin:0;
  font-size:42px;
  font-weight:800;
}

header p{
  margin:14px 0 0;
  font-size:25px;
  font-weight:500;
}

main{
  max-width:900px;
  margin:40px auto;
  padding:0 24px 60px;
}

.card{
  background:white;
  border-radius:38px;
  padding:50px 36px;
  margin-bottom:28px;
}

h2{
  margin:0 0 45px;
  color:var(--green);
  font-size:46px;
}

h3{
  color:var(--green);
}

.field{
  margin-bottom:32px;
  position:relative;
}

label{
  display:block;
  font-size:26px;
  font-weight:800;
  margin-bottom:17px;
}

input,
select{
  width:100%;
  font-size:22px;
  padding:18px 24px;
  border:3px solid var(--border);
  border-radius:25px;
  background:white;
  color:#111;
  outline:none;
  min-height:70px;
}

input:focus,
select:focus{
  border-color:var(--blue);
}

input::placeholder{
  color:#aaa;
}

.small{
  font-size:18px;
  color:var(--muted);
  font-weight:600;
  margin-top:12px;
}

.suggestions{
  display:none;
  position:absolute;
  z-index:20;
  left:0;
  right:0;
  top:calc(100% - 2px);
  background:#fff;
  border:2px solid #ddd;
  border-radius:0 0 24px 24px;
  box-shadow:0 14px 30px rgba(0,0,0,.13);
  max-height:330px;
  overflow-y:auto;
}

.suggestion{
  padding:17px 22px;
  border-bottom:1px solid #eee;
  font-size:20px;
  cursor:pointer;
}

.suggestion:last-child{
  border-bottom:none;
}

.suggestion:hover,
.suggestion:active{
  background:#f1f7f5;
}

.suggestion .cat{
  display:block;
  color:#777;
  font-size:14px;
  margin-top:3px;
}

.empty{
  padding:18px 22px;
  color:#777;
}

button{
  width:100%;
  border:none;
  border-radius:26px;
  padding:20px 24px;
  background:var(--green2);
  color:white;
  font-size:24px;
  font-weight:800;
  cursor:pointer;
}

button:active{
  transform:scale(.995);
}

.secondary{
  background:white;
  color:var(--green);
  border:3px solid var(--green);
}

.danger{
  background:white;
  color:var(--danger);
  border:3px solid var(--danger);
  margin-top:18px;
}

.result{
  display:none;
  margin-top:32px;
  border-top:2px solid #e7e7e7;
  padding-top:28px;
}

.result h3{
  font-size:28px;
  margin:0 0 8px;
}

.result-meta{
  color:#777;
  font-size:18px;
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:19px;
}

th,
td{
  text-align:left;
  padding:14px 8px;
  border-bottom:1px solid #e6e6e6;
}

th:last-child,
td:last-child{
  text-align:right;
}

/* ZUSÄTZLICHE ZUTAT BEI VORHANDENEN GERICHTEN */

.extraIngredientArea{
  margin-top:28px;
  padding-top:24px;
  border-top:2px solid #eee;
}

.extraIngredientArea h4{
  margin:0 0 16px;
  font-size:21px;
  color:var(--green);
}

#extraIngredientForm{
  display:none;
  margin-top:18px;
}

.extraIngredientRow{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}

.extraIngredientRow input,
.extraIngredientRow select{
  min-height:56px;
  padding:10px 14px;
  font-size:16px;
  border-width:2px;
  border-radius:17px;
}

.extraActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.extraActions button{
  font-size:17px;
  padding:14px;
  min-height:54px;
}

.extraIngredientMarker{
  display:block;
  color:#777;
  font-size:12px;
  margin-top:3px;
}

.removeExtra{
  width:auto;
  min-height:0;
  padding:4px 9px;
  margin-left:8px;
  border-radius:9px;
  background:white;
  border:1px solid #ccc;
  color:var(--danger);
  font-size:13px;
  font-weight:700;
}

/* EIGENES GERICHT */

#customForm{
  display:none;
  margin-top:30px;
}

.sectionText{
  color:#666;
  font-size:19px;
  line-height:1.5;
  margin:-25px 0 35px;
}

.ingredientRow{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 52px;
  gap:10px;
  margin-bottom:12px;
  align-items:center;
}

.ingredientRow input,
.ingredientRow select{
  min-height:58px;
  padding:12px 15px;
  font-size:17px;
  border-radius:18px;
  border-width:2px;
}

.removeIngredient{
  width:52px;
  height:52px;
  min-height:0;
  padding:0;
  border-radius:50%;
  background:#eee;
  color:#555;
  font-size:28px;
}

.addIngredient{
  margin-top:8px;
  background:white;
  color:var(--green);
  border:3px solid var(--green);
}

.saveRecipe{
  margin-top:28px;
}

.success{
  display:none;
  background:#e8f5f0;
  color:var(--green);
  padding:18px 20px;
  border-radius:18px;
  margin-top:22px;
  font-size:18px;
  font-weight:700;
}

@media(max-width:600px){

  header{
    padding:24px 30px 30px;
  }

  header h1{
    font-size:34px;
  }

  header p{
    font-size:20px;
  }

  main{
    margin:28px auto;
    padding:0 20px 40px;
  }

  .card{
    border-radius:32px;
    padding:38px 28px;
  }

  h2{
    font-size:38px;
    margin-bottom:40px;
  }

  label{
    font-size:22px;
  }

  input,
  select{
    font-size:19px;
    min-height:65px;
    padding:15px 19px;
  }

  button{
    font-size:21px;
    padding:18px;
  }

  .ingredientRow{
    grid-template-columns:1fr 85px 78px 44px;
    gap:6px;
  }

  .ingredientRow input,
  .ingredientRow select{
    font-size:15px;
    padding:8px;
    min-height:52px;
  }

  .removeIngredient{
    width:44px;
    height:44px;
    font-size:23px;
  }

  .extraIngredientRow{
    grid-template-columns:1fr 80px 75px;
    gap:6px;
  }

  .extraIngredientRow input,
  .extraIngredientRow select{
    min-height:50px;
    font-size:14px;
    padding:7px;
  }
}
</style>
</head>

<body>

<header>
  <h1>GastroPilot</h1>
  <p>Dein digitaler Küchenassistent</p>
</header>

<main>

<section class="card">

<h2>Mengenrechner</h2>

<div class="field" id="searchField">
  <label for="search">Gericht suchen</label>

  <input
    id="search"
    type="text"
    autocomplete="off"
    placeholder="z. B. Lachs, Curry, Pasta …"
  >

  <div id="suggestions" class="suggestions"></div>
</div>

<div class="field">
  <label for="category">Kategorie</label>

  <select id="category">
    <option value="Alle Gerichte">Alle Gerichte</option>
    <option value="Fleisch">Fleisch</option>
    <option value="Fisch">Fisch</option>
    <option value="Vegetarisch">Vegetarisch</option>
    <option value="Vegan">Vegan</option>
    <option value="Pasta">Pasta</option>
  </select>
</div>

<div class="field">
  <label for="dish">Gericht auswählen</label>

  <select id="dish"></select>

  <div class="small" id="count"></div>
</div>

<div class="field">
  <label for="portions">Anzahl Portionen</label>

  <input
    id="portions"
    type="number"
    inputmode="numeric"
    min="1"
    max="10000"
    value="10"
  >
</div>

<button id="calculate">Mengen berechnen</button>

<button id="deleteRecipe" class="danger" style="display:none;">
  Eigenes Gericht löschen
</button>

<div id="result" class="result">

  <h3 id="resultTitle"></h3>

  <div id="resultMeta" class="result-meta"></div>

  <table>
    <thead>
      <tr>
        <th>Zutat</th>
        <th>Menge</th>
      </tr>
    </thead>

    <tbody id="ingredientRows"></tbody>
  </table>

  <div class="extraIngredientArea">

    <button id="toggleExtraIngredient" type="button" class="secondary">
      + Weitere Zutat hinzufügen
    </button>

    <div id="extraIngredientForm">

      <h4>Weitere Zutat</h4>

      <div class="extraIngredientRow">

        <input
          id="extraIngredientName"
          type="text"
          autocomplete="off"
          placeholder="Zutat"
        >

        <input
          id="extraIngredientAmount"
          type="number"
          min="0"
          step="0.01"
          inputmode="decimal"
          placeholder="Menge"
        >

        <select id="extraIngredientUnit">
          <option value="g">g</option>
          <option value="kg">kg</option>
          <option value="ml">ml</option>
          <option value="l">l</option>
          <option value="Stk">Stk</option>
        </select>

      </div>

      <div class="extraActions">

        <button id="saveExtraIngredient" type="button">
          Zutat speichern
        </button>

        <button id="cancelExtraIngredient" type="button" class="secondary">
          Abbrechen
        </button>

      </div>

    </div>

  </div>

</div>

</section>


<section class="card">

<h2>Eigenes Gericht</h2>

<p class="sectionText">
Du kannst eigene Gerichte anlegen. Sie werden anschließend
automatisch in GastroPilot gespeichert und können genauso
berechnet werden wie die vorhandenen Gerichte.
</p>

<button id="toggleCustom" class="secondary">
  + Eigenes Gericht hinzufügen
