<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GastroPilot – Mengenrechner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f2f4f3;
      color: #222;
    }

    .header {
      background: #164c40;
      color: white;
      padding: 24px 20px;
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      margin: 0;
    }

    .subtitle {
      margin-top: 5px;
      font-size: 17px;
      opacity: 0.9;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 50px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 28px;
      margin-bottom: 28px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.04);
    }

    h1 {
      color: #164c40;
      margin-top: 0;
      font-size: 38px;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-size: 20px;
      font-weight: 700;
      margin-top: 26px;
      margin-bottom: 10px;
    }

    input,
    select {
      width: 100%;
      min-height: 58px;
      padding: 13px 16px;
      border: 2px solid #d0d0d0;
      border-radius: 14px;
      background: white;
      font-size: 20px;
      color: #111;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #64b5f6;
      box-shadow: 0 0 0 3px rgba(100,181,246,0.25);
    }

    .search-wrapper {
      position: relative;
    }

    .suggestions {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 6px);
      background: white;
      border: 1px solid #d5d5d5;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.16);
      overflow: hidden;
      z-index: 1000;
      max-height: 330px;
      overflow-y: auto;
    }

    .suggestion-item {
      padding: 15px 16px;
      border-bottom: 1px solid #eeeeee;
      cursor: pointer;
      background: white;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:active {
      background: #edf5f2;
    }

    .suggestion-name {
      display: block;
      font-size: 18px;
      font-weight: 700;
      color: #164c40;
    }

    .suggestion-category {
      display: block;
      margin-top: 3px;
      font-size: 14px;
      color: #777;
    }

    .no-result {
      padding: 16px;
      color: #777;
      font-size: 16px;
    }

    .count {
      margin-top: 9px;
      color: #777;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 28px;
      border: 0;
      border-radius: 14px;
      padding: 17px 20px;
      background: #217b65;
      color: white;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.99);
    }

    .result-card {
      display: none;
    }

    .badge {
      display: inline-block;
      background: #edf5f2;
      color: #164c40;
      font-weight: 700;
      padding: 9px 15px;
      border-radius: 30px;
      margin-bottom: 18px;
    }

    .result-title {
      font-size: 34px;
      line-height: 1.15;
      color: #164c40;
      margin: 0 0 10px;
    }

    .result-portions {
      font-size: 20px;
      color: #666;
      margin-bottom: 26px;
    }

    .ingredients {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
    }

    .ingredients th {
      text-align: left;
      background: #e8f1ee;
      color: #164c40;
      padding: 14px 12px;
      font-size: 17px;
    }

    .ingredients td {
      padding: 14px 12px;
      border-bottom: 1px solid #e7e7e7;
      font-size: 17px;
    }

    .ingredients td:last-child {
      text-align: right;
      font-weight: 700;
    }

    .message {
      display: none;
      margin-top: 18px;
      background: #fff2f2;
      border: 1px solid #efb4b4;
      color: #9b2525;
      padding: 13px 15px;
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      .header {
        padding: 20px 18px;
      }

      .logo {
        font-size: 28px;
      }

      .container {
        padding: 20px 12px 40px;
      }

      .card {
        padding: 22px 18px;
        border-radius: 20px;
      }

      h1 {
        font-size: 32px;
      }

      .result-title {
        font-size: 29px;
      }

      input,
      select {
        font-size: 18px;
      }

      label {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="header-inner">
      <div class="logo">GastroPilot</div>
      <div class="subtitle">Dein digitaler Küchenassistent</div>
    </div>
  </header>

  <main class="container">

    <section class="card">

      <h1>Mengenrechner</h1>

      <!-- SUCHE -->
      <label for="searchInput">Gericht suchen</label>

      <div class="search-wrapper">
        <input
          id="searchInput"
          type="text"
          placeholder="z. B. Curry, Schnitzel, Gulasch..."
          autocomplete="off"
        >

        <div id="suggestions" class="suggestions"></div>
      </div>

      <!-- KATEGORIE -->
      <label for="categorySelect">Kategorie auswählen</label>

      <select id="categorySelect">
        <option value="alle">Alle Gerichte</option>
        <option value="Fleisch">Fleisch</option>
        <option value="Vegetarisch">Vegetarisch</option>
      </select>

      <!-- GERICHT -->
      <label for="dishSelect">Gericht auswählen</label>

      <select id="dishSelect">
        <option value="">Bitte Gericht auswählen</option>
      </select>

      <div id="dishCount" class="count"></div>

      <!-- PORTIONEN -->
      <label for="portionInput">Anzahl Portionen</label>

      <input
        id="portionInput"
        type="number"
        value="10"
        min="1"
        step="1"
        inputmode="numeric"
      >

      <button id="calculateButton">
        Mengen berechnen
      </button>

      <div id="message" class="message"></div>

    </section>

    <!-- ERGEBNIS -->
    <section id="resultCard" class="card result-card">

      <div id="resultCategory" class="badge"></div>

      <div id="resultTitle" class="result-title"></div>

      <div id="resultPortions" class="result-portions"></div>

      <table class="ingredients">
        <thead>
          <tr>
            <th>Zutat</th>
            <th>Menge</th>
          </tr>
        </thead>

        <tbody id="ingredientBody"></tbody>
      </table>

    </section>

  </main>

  <script>

    /* =========================================================
       GERICHTE
       Alle Mengen beziehen sich auf 10 Portionen.
       ========================================================= */

    const dishes = [

      {
        id: "zuericher",
        name: "Züricher Geschnetzeltes",
        category: "Fleisch",
        basePortions: 10,
        ingredients: [
          { name: "Schweinegeschnetzeltes", amount: 1500, unit: "g" },
          { name: "Champignons", amount: 700, unit: "g" },
          { name: "Zwiebeln", amount: 300, unit: "g" },
          { name: "Sahne", amount: 800, unit: "ml" },
          { name: "Brühe", amount: 500, unit: "ml" },
          { name: "Öl", amount: 100, unit: "ml" },
          { name: "Rösti-Ecken", amount: 30, unit: "Stück" }
        ]
      },

      {
        id: "masala",
        name: "Kichererbsen Masala",
        category: "Vegetarisch",
        basePortions: 10,
        ingredients: [
          { name: "Kichererbsen", amount: 1800, unit: "g" },
          { name: "Tomaten", amount: 1000, unit: "g" },
          { name: "Zwiebeln", amount: 400, unit: "g" },
          { name: "Kokosmilch", amount: 1000, unit: "ml" },
          { name: "Paprika", amount: 600, unit: "g" },
          { name: "Öl", amount: 100, unit: "ml" },
          { name: "Basmatireis", amount: 800, unit: "g" }
        ]
      },

      {
        id: "cordon",
        name: "Cordon Bleu mit Pommes",
        category: "Fleisch",
        basePortions: 10,
        ingredients: [
          { name: "Cordon Bleu", amount: 10, unit: "Stück" },
          { name: "Pommes frites", amount: 2000, unit: "g" },
          { name: "Öl / Frittierfett", amount: 200, unit: "ml" }
        ]
      },

      {
        id: "schnitzel",
        name: "Schnitzel mit Pommes",
        category: "Fleisch",
        basePortions: 10,
        ingredients: [
          { name: "Schweineschnitzel", amount: 1800, unit: "g" },
          { name: "Mehl", amount: 200, unit: "g" },
          { name: "Eier", amount: 5, unit: "Stück" },
          { name: "Paniermehl", amount: 400, unit: "g" },
          { name: "Pommes frites", amount: 2000, unit: "g" },
          { name: "Öl / Frittierfett", amount: 250, unit: "ml" }
        ]
      },

      {
        id: "curry",
        name: "Gemüsecurry mit Reis",
        category: "Vegetarisch",
        basePortions: 10,
        ingredients: [
          { name: "Basmatireis", amount: 800, unit: "g" },
          { name: "Paprika", amount: 600, unit: "g" },
          { name: "Zucchini", amount: 600, unit: "g" },
          { name: "Möhren", amount: 500, unit: "g" },
          { name: "Brokkoli", amount: 600, unit: "g" },
          { name: "Kokosmilch", amount: 1200, unit: "ml" },
          { name: "Currypaste", amount: 120, unit: "g" },
          { name: "Öl", amount: 100, unit: "ml" }
        ]
      },

      {
        id: "haehnchen",
        name: "Hähnchengeschnetzeltes mit Reis",
        category: "Fleisch",
        basePortions: 10,
        ingredients: [
          { name: "Hähnchenbrust", amount: 1600, unit: "g" },
          { name: "Basmatireis", amount: 800, unit: "g" },
          { name: "Paprika", amount: 600, unit: "g" },
          { name: "Zwiebeln", amount: 300, unit: "g" },
          { name: "Sahne", amount: 800, unit: "ml" },
          { name: "Brühe", amount: 500, unit: "ml" },
          { name: "Öl", amount: 100, unit: "ml" }
        ]
      },

      {
        id: "spaghetti",
        name: "Spaghetti Bolognese",
        category: "Fleisch",
        basePortions: 10,
        ingredients: [
          { name: "Spaghetti", amount: 1000, unit: "g" },
          { name: "Rinderhackfleisch", amount: 1200, unit: "g" },
          { name: "Tomaten", amount: 1500, unit: "g" },
          { name: "Zwiebeln", amount: 300, unit: "g" },
          { name: "Möhren", amount: 300, unit: "g" },
          { name: "Tomatenmark", amount: 200, unit: "g" },
          { name: "Öl", amount: 100, unit: "ml" }
        ]
      },

      {
        id: "gulasch",
        name: "Rindergulasch mit Kartoffeln",
        category: "Fleisch",
        basePortions: 10,
        ingredients: [
          { name: "Rindergulasch", amount: 1800, unit: "g" },
          { name: "Kartoffeln", amount: 2500, unit: "g" },
          { name: "Zwiebeln", amount: 600, unit: "g" },
          { name: "Paprika", amount: 500, unit: "g" },
          { name: "Tomatenmark", amount: 200, unit: "g" },
          { name: "Brühe", amount: 1200, unit: "ml" },
          { name: "Öl", amount: 100, unit: "ml" }
        ]
      },

      {
        id: "linsenbolognese",
        name: "Linsen-Bolognese mit Pasta",
        category: "Vegetarisch",
        basePortions: 10,
        ingredients: [
          { name: "Pasta", amount: 1000, unit: "g" },
          { name: "Rote Linsen", amount: 800, unit: "g" },
          { name: "Tomaten", amount: 1500, unit: "g" },
          { name: "Zwiebeln", amount: 300, unit: "g" },
          { name: "Möhren", amount: 400, unit: "g" },
          { name: "Tomatenmark", amount: 200, unit: "g" },
          { name: "Gemüsebrühe", amount: 1000, unit: "ml" },
          { name: "Öl", amount: 100, unit: "ml" }
        ]
      }

    ];


    /* =========================================================
       ELEMENTE
       ========================================================= */

    const searchInput =
      document.getElementById("searchInput");

    const suggestions =
      document.getElementById("suggestions");

    const categorySelect =
      document.getElementById("categorySelect");

    const dishSelect =
      document.getElementById("dishSelect");

    const dishCount =
      document.getElementById("dishCount");

    const portionInput =
      document.getElementById("portionInput");

    const calculateButton =
      document.getElementById("calculateButton");

    const message =
      document.getElementById("message");

    const resultCard =
      document.getElementById("resultCard");

    const resultCategory =
      document.getElementById("resultCategory");

    const resultTitle =
      document.getElementById("resultTitle");

    const resultPortions =
      document.getElementById("resultPortions");

    const ingredientBody =
      document.getElementById("ingredientBody");


    /* =========================================================
       TEXT NORMALISIEREN
       Damit Suche auch ohne ä / ö / ü funktioniert.
       ========================================================= */

    function normalizeText(text) {

      return text
        .toLowerCase()
        .replace(/ä/g, "a")
        .replace(/ö/g, "o")
        .replace(/ü/g, "u")
        .replace(/ß/g, "ss");

    }


    /* =========================================================
       DROPDOWN AKTUALISIEREN
       ========================================================= */

    function updateDishSelect() {

      const category = categorySelect.value;

      let filteredDishes = dishes;

      if (category !== "alle") {

        filteredDishes = dishes.filter(
          dish => dish.category === category
        );

      }

      dishSelect.innerHTML =
        '<option value="">Bitte Gericht auswählen</option>';

      filteredDishes.forEach(dish => {

        const option = document.createElement("option");

        option.value = dish.id;
        option.textContent = dish.name;

        dishSelect.appendChild(option);

      });

      if (filteredDishes.length === 1) {

        dishCount.textContent = "1 Gericht";

      } else {

        dishCount.textContent =
          filteredDishes.length + " Gerichte";

      }

    }


    /* =========================================================
       LIVE-SUCHE
       ========================================================= */

    function showSuggestions() {

      const searchText =
        normalizeText(searchInput.value.trim());

      suggestions.innerHTML = "";

      if (searchText.length === 0) {

        suggestions.style.display = "none";
        return;

      }

      const matches = dishes.filter(dish => {

        return normalizeText(dish.name)
          .includes(searchText);

      });

      if (matches.length === 0) {

        const noResult =
          document.createElement("div");

        noResult.className = "no-result";
        noResult.textContent =
          "Kein Gericht gefunden";

        suggestions.appendChild(noResult);

        suggestions.style.display = "block";

        return;

      }

      matches.forEach(dish => {

        const item =
          document.createElement("div");

        item.className = "suggestion-item";

        const name =
          document.createElement("span");

        name.className = "suggestion-name";
        name.textContent = dish.name;

        const category =
          document.createElement("span");

        category.className =
          "suggestion-category";

        category.textContent =
          dish.category;

        item.appendChild(name);
        item.appendChild(category);

        item.addEventListener("click", function() {

          selectDishFromSearch(dish);

        });

        suggestions.appendChild(item);

      });

      suggestions.style.display = "block";

    }


    /* =========================================================
       TREFFER AUS SUCHE AUSWÄHLEN
       ========================================================= */

    function selectDishFromSearch(dish) {

      searchInput.value = dish.name;

      categorySelect.value = dish.category;

      updateDishSelect();

      dishSelect.value = dish.id;

      suggestions.style.display = "none";

      dishCount.textContent =
        "Gericht ausgewählt";

    }


    /* =========================================================
       MENGE FORMATIEREN
       ========================================================= */

    function formatAmount(amount) {

      if (Number.isInteger(amount)) {

        return amount.toString();

      }

      if (amount >= 100) {

        return amount.toFixed(0);

      }

      return amount
        .toFixed(1)
        .replace(".", ",");

    }


    /* =========================================================
       MENGEN BERECHNEN
       ========================================================= */

    function calculate() {

      hideMessage();

      const dishId =
        dishSelect.value;

      const portions =
        Number(portionInput.value);

      if (!dishId) {

        showMessage(
          "Bitte zuerst ein Gericht auswählen."
        );

        return;

      }

      if (!portions || portions < 1) {

        showMessage(
          "Bitte eine gültige Portionszahl eingeben."
        );

        return;

      }

      const dish =
        dishes.find(
          item => item.id === dishId
        );

      if (!dish) {

        showMessage(
          "Das Gericht konnte nicht gefunden werden."
        );

        return;

      }

      const factor =
        portions / dish.basePortions;

      resultCategory.textContent =
        dish.category;

      resultTitle.textContent =
        dish.name;

      resultPortions.textContent =
        "Berechnung für " +
        portions +
        (portions === 1
          ? " Portion"
          : " Portionen");

      ingredientBody.innerHTML = "";

      dish.ingredients.forEach(ingredient => {

        const row =
          document.createElement("tr");

        const nameCell =
          document.createElement("td");

        const amountCell =
          document.createElement("td");

        nameCell.textContent =
          ingredient.name;

        const calculatedAmount =
          ingredient.amount * factor;

        amountCell.textContent =
          formatAmount(calculatedAmount) +
          " " +
          ingredient.unit;

        row.appendChild(nameCell);
        row.appendChild(amountCell);

        ingredientBody.appendChild(row);

      });

      resultCard.style.display = "block";

      setTimeout(() => {

        resultCard.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }, 100);

    }


    /* =========================================================
       FEHLERMELDUNG
       ========================================================= */

    function showMessage(text) {

      message.textContent = text;
      message.style.display = "block";

    }

    function hideMessage() {

      message.style.display = "none";
      message.textContent = "";

    }


    /* =========================================================
       EVENTS
       ========================================================= */

    searchInput.addEventListener(
      "input",
      showSuggestions
    );


    searchInput.addEventListener(
      "focus",
      function() {

        if (searchInput.value.trim() !== "") {

          showSuggestions();

        }

      }
    );


    categorySelect.addEventListener(
      "change",
      function() {

        updateDishSelect();

        searchInput.value = "";

        suggestions.style.display = "none";

      }
    );


    dishSelect.addEventListener(
      "change",
      function() {

        const dish =
          dishes.find(
            item => item.id === dishSelect.value
          );

        if (dish) {

          searchInput.value = dish.name;

        }

      }
    );


    calculateButton.addEventListener(
      "click",
      calculate
    );


    portionInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          calculate();

        }

      }
    );


    document.addEventListener(
      "click",
      function(event) {

        if (
          !searchInput.contains(event.target) &&
          !suggestions.contains(event.target)
        ) {

          suggestions.style.display = "none";

        }

      }
    );


    /* =========================================================
       START
       ========================================================= */

    updateDishSelect();

  </script>

</body>
</html>
