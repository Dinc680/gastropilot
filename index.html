<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GastroPilot – Mengenrechner</title>

<style>
*{box-sizing:border-box}

:root{
  --green:#135847;
  --green2:#22866f;
  --bg:#f1f3f2;
  --text:#202020;
  --muted:#777;
  --border:#cfcfcf;
  --blue:#59aef0;
  --danger:#b53a3a;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:var(--green);
  color:white;
  padding:28px 36px 36px;
}

header h1{
  margin:0;
  font-size:42px;
  font-weight:800;
}

header p{
  margin:14px 0 0;
  font-size:25px;
  font-weight:500;
}

main{
  max-width:900px;
  margin:40px auto;
  padding:0 24px 60px;
}

.card{
  background:white;
  border-radius:38px;
  padding:50px 36px;
  margin-bottom:28px;
}

h2{
  margin:0 0 45px;
  color:var(--green);
  font-size:46px;
}

h3{
  color:var(--green);
}

.field{
  margin-bottom:32px;
  position:relative;
}

label{
  display:block;
  font-size:26px;
  font-weight:800;
  margin-bottom:17px;
}

input,
select{
  width:100%;
  font-size:22px;
  padding:18px 24px;
  border:3px solid var(--border);
  border-radius:25px;
  background:white;
  color:#111;
  outline:none;
  min-height:70px;
}

input:focus,
select:focus{
  border-color:var(--blue);
}

input::placeholder{
  color:#aaa;
}

.small{
  font-size:18px;
  color:var(--muted);
  font-weight:600;
  margin-top:12px;
}

.suggestions{
  display:none;
  position:absolute;
  z-index:20;
  left:0;
  right:0;
  top:calc(100% - 2px);
  background:#fff;
  border:2px solid #ddd;
  border-radius:0 0 24px 24px;
  box-shadow:0 14px 30px rgba(0,0,0,.13);
  max-height:330px;
  overflow-y:auto;
}

.suggestion{
  padding:17px 22px;
  border-bottom:1px solid #eee;
  font-size:20px;
  cursor:pointer;
}

.suggestion:last-child{
  border-bottom:none;
}

.suggestion:hover,
.suggestion:active{
  background:#f1f7f5;
}

.suggestion .cat{
  display:block;
  color:#777;
  font-size:14px;
  margin-top:3px;
}

.empty{
  padding:18px 22px;
  color:#777;
}

button{
  width:100%;
  border:none;
  border-radius:26px;
  padding:20px 24px;
  background:var(--green2);
  color:white;
  font-size:24px;
  font-weight:800;
  cursor:pointer;
}

button:active{
  transform:scale(.995);
}

.secondary{
  background:white;
  color:var(--green);
  border:3px solid var(--green);
}

.danger{
  background:white;
  color:var(--danger);
  border:3px solid var(--danger);
  margin-top:18px;
}

.result{
  display:none;
  margin-top:32px;
  border-top:2px solid #e7e7e7;
  padding-top:28px;
}

.result h3{
  font-size:28px;
  margin:0 0 8px;
}

.result-meta{
  color:#777;
  font-size:18px;
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:19px;
}

th,
td{
  text-align:left;
  padding:14px 8px;
  border-bottom:1px solid #e6e6e6;
}

th:last-child,
td:last-child{
  text-align:right;
}

/* EIGENES GERICHT */

#customForm{
  display:none;
  margin-top:30px;
}

.sectionText{
  color:#666;
  font-size:19px;
  line-height:1.5;
  margin:-25px 0 35px;
}

.ingredientRow{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 52px;
  gap:10px;
  margin-bottom:12px;
  align-items:center;
}

.ingredientRow input,
.ingredientRow select{
  min-height:58px;
  padding:12px 15px;
  font-size:17px;
  border-radius:18px;
  border-width:2px;
}

.removeIngredient{
  width:52px;
  height:52px;
  min-height:0;
  padding:0;
  border-radius:50%;
  background:#eee;
  color:#555;
  font-size:28px;
}

.addIngredient{
  margin-top:8px;
  background:white;
  color:var(--green);
  border:3px solid var(--green);
}

.saveRecipe{
  margin-top:28px;
}

.success{
  display:none;
  background:#e8f5f0;
  color:var(--green);
  padding:18px 20px;
  border-radius:18px;
  margin-top:22px;
  font-size:18px;
  font-weight:700;
}

.customBadge{
  display:inline-block;
  margin-left:8px;
  background:#e8f5f0;
  color:var(--green);
  padding:4px 8px;
  border-radius:8px;
  font-size:13px;
}

@media(max-width:600px){

  header{
    padding:24px 30px 30px;
  }

  header h1{
    font-size:34px;
  }

  header p{
    font-size:20px;
  }

  main{
    margin:28px auto;
    padding:0 20px 40px;
  }

  .card{
    border-radius:32px;
    padding:38px 28px;
  }

  h2{
    font-size:38px;
    margin-bottom:40px;
  }

  label{
    font-size:22px;
  }

  input,
  select{
    font-size:19px;
    min-height:65px;
    padding:15px 19px;
  }

  button{
    font-size:21px;
    padding:18px;
  }

  .ingredientRow{
    grid-template-columns:1fr 85px 78px 44px;
    gap:6px;
  }

  .ingredientRow input,
  .ingredientRow select{
    font-size:15px;
    padding:8px;
    min-height:52px;
  }

  .removeIngredient{
    width:44px;
    height:44px;
    font-size:23px;
  }
}
</style>
</head>

<body>

<header>
  <h1>GastroPilot</h1>
  <p>Dein digitaler Küchenassistent</p>
</header>

<main>

<section class="card">

<h2>Mengenrechner</h2>

<div class="field" id="searchField">
  <label for="search">Gericht suchen</label>

  <input
    id="search"
    type="text"
    autocomplete="off"
    placeholder="z. B. Lachs, Curry, Pasta …"
  >

  <div id="suggestions" class="suggestions"></div>
</div>


<div class="field">
  <label for="category">Kategorie</label>

  <select id="category">
    <option value="Alle Gerichte">Alle Gerichte</option>
    <option value="Fleisch">Fleisch</option>
    <option value="Fisch">Fisch</option>
    <option value="Vegetarisch">Vegetarisch</option>
    <option value="Vegan">Vegan</option>
    <option value="Pasta">Pasta</option>
  </select>
</div>


<div class="field">
  <label for="dish">Gericht auswählen</label>

  <select id="dish"></select>

  <div class="small" id="count"></div>
</div>


<div class="field">
  <label for="portions">Anzahl Portionen</label>

  <input
    id="portions"
    type="number"
    inputmode="numeric"
    min="1"
    max="10000"
    value="10"
  >
</div>


<button id="calculate">Mengen berechnen</button>

<button id="deleteRecipe" class="danger" style="display:none;">
  Eigenes Gericht löschen
</button>


<div id="result" class="result">

  <h3 id="resultTitle"></h3>

  <div id="resultMeta" class="result-meta"></div>

  <table>
    <thead>
      <tr>
        <th>Zutat</th>
        <th>Menge</th>
      </tr>
    </thead>

    <tbody id="ingredientRows"></tbody>
  </table>

</div>

</section>


<!-- EIGENES GERICHT -->

<section class="card">

<h2>Eigenes Gericht</h2>

<p class="sectionText">
Du kannst eigene Gerichte anlegen. Sie werden anschließend
automatisch in GastroPilot gespeichert und können genauso
berechnet werden wie die vorhandenen Gerichte.
</p>

<button id="toggleCustom" class="secondary">
  + Eigenes Gericht hinzufügen
</button>


<div id="customForm">

  <div class="field">
    <label for="customName">Name des Gerichts</label>

    <input
      id="customName"
      type="text"
      placeholder="z. B. Mein Hähnchen-Curry"
    >
  </div>


  <div class="field">
    <label for="customCategory">Kategorie</label>

    <select id="customCategory">
      <option value="Fleisch">Fleisch</option>
      <option value="Fisch">Fisch</option>
      <option value="Vegetarisch">Vegetarisch</option>
      <option value="Vegan">Vegan</option>
      <option value="Pasta">Pasta</option>
    </select>
  </div>


  <div class="field">
    <label for="customBase">Grundmenge für wie viele Portionen?</label>

    <input
      id="customBase"
      type="number"
      min="1"
      value="10"
    >
  </div>


  <div class="field">

    <label>Zutaten</label>

    <div id="customIngredients"></div>

    <button
      id="addIngredient"
      type="button"
      class="addIngredient"
    >
      + Weitere Zutat
    </button>

  </div>


  <button id="saveRecipe" class="saveRecipe">
    Gericht speichern
  </button>

  <div id="saveSuccess" class="success">
    Gericht wurde gespeichert ✓
  </div>

</div>

</section>

</main>

===================================================== */

function loadCustomRecipes(){

  try{

    const stored =
    localStorage.getItem("gastropilot_custom_recipes");

    return stored
      ? JSON.parse(stored)
      : [];

  }catch(error){

    return [];

  }

}

let customRecipes = loadCustomRecipes();


function saveCustomRecipes(){

  localStorage.setItem(
    "gastropilot_custom_recipes",
    JSON.stringify(customRecipes)
  );

}


function allRecipes(){

  return [
    ...standardRecipes,
    ...customRecipes

}

/* =====================================================
   NORMALISIERUNG
===================================================== */

function normalize(text){

  return text
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");

}


/* =====================================================
   KATEGORIEN
===================================================== */

function categoryRecipes(){

  const recipes = allRecipes();

  if(category.value === "Alle Gerichte"){
    return recipes;
  }

  return recipes.filter(
    recipe =>
    recipe.category === category.value
  );

}


/* =====================================================
   DROPDOWN FÜLLEN
===================================================== */

function fillDishSelect(selectedName=""){

  const list =
  categoryRecipes();

  dish.innerHTML =
  '<option value="">Bitte Gericht auswählen</option>';

  list.forEach(recipe => {

    const option =
    document.createElement("option");

    option.value =
    recipe.name;

    option.textContent =
    recipe.name +
    (recipe.custom ? " ★" : "");

    dish.appendChild(option);

  });

  count.textContent =
  list.length +
  (
    list.length === 1
    ? " Gericht"
    : " Gerichte"
  );

  if(
    selectedName &&
    list.some(
      recipe =>
      recipe.name === selectedName
    )
  ){

    dish.value =
    selectedName;

  }

}


/* =====================================================
   SUCHVORSCHLÄGE
===================================================== */

function showSuggestions(){

  const query =
  normalize(
    search.value.trim()
  );

  if(!query){

    suggestions.style.display =
    "none";

    suggestions.innerHTML =
    "";

    return;

  }

  const matches =
  categoryRecipes()
  .filter(recipe =>

    normalize(recipe.name)
    .includes(query)

    ||

    normalize(recipe.category)
    .includes(query)

  )
  .slice(0,15);


  suggestions.innerHTML =
  "";


  if(matches.length === 0){

    suggestions.innerHTML =
    '<div class="empty">Kein passendes Gericht gefunden</div>';

  }else{

    matches.forEach(recipe => {

      const element =
      document.createElement("div");

      element.className =
      "suggestion";

      element.innerHTML =
      "<strong>" +
      recipe.name +
      "</strong>" +

      '<span class="cat">' +
      recipe.category +

      (
        recipe.custom
        ? " · Eigenes Gericht"
        : ""
      ) +

      "</span>";

      element.addEventListener(
        "click",
        () => chooseRecipe(recipe)
      );

      suggestions.appendChild(
        element
      );

    });

  }

  suggestions.style.display =
  "block";

}


/* =====================================================
   GERICHT AUSWÄHLEN
===================================================== */

function chooseRecipe(recipe){

  dish.value =
  recipe.name;

  search.value =
  recipe.name;

  suggestions.style.display =
  "none";

  renderResult();

}


/* =====================================================
   MENGEN FORMATIEREN
===================================================== */

function formatAmount(value,unit){

  if(unit === "Stk"){

    const rounded =
    Math.round(value * 10) / 10;

    return (
      Number.isInteger(rounded)
      ? rounded.toFixed(0)
      : rounded.toFixed(1)
    ) + " Stk";

  }


  if(unit === "kg"){

    if(value < 1){

      return Math.round(
        value * 1000
      ) + " g";

    }

    return value.toLocaleString(
      "de-DE",
      {
        minimumFractionDigits:
        value < 10 ? 2 : 1,

        maximumFractionDigits:2
      }
    ) + " kg";

  }


  if(unit === "l"){

    if(value < 1){

      return Math.round(
        value * 1000
      ) + " ml";

    }

    return value.toLocaleString(
      "de-DE",
      {
        minimumFractionDigits:
        value < 10 ? 2 : 1,

        maximumFractionDigits:2
      }
    ) + " l";

  }


  if(unit === "g"){

    if(value >= 1000){

      return (
        value / 1000
      ).toLocaleString(
        "de-DE",
        {
          maximumFractionDigits:2
        }
      ) + " kg";

    }

    return Math.round(value) +
    " g";

  }


  if(unit === "ml"){

    if(value >= 1000){

      return (
        value / 1000
      ).toLocaleString(
        "de-DE",
        {
          maximumFractionDigits:2
        }
      ) + " l";

    }

    return Math.round(value) +
    " ml";

  }


  return value.toLocaleString(
    "de-DE",
    {
      maximumFractionDigits:2
    }
  ) +
  " " +
  unit;

}


/* =====================================================
   BERECHNUNG
===================================================== */

function renderResult(){

  const selected =
  allRecipes().find(
    recipe =>
    recipe.name === dish.value
  );

  const p =
  Number(portions.value);


  if(!selected){

    alert(
      "Bitte zuerst ein Gericht auswählen."
    );

    return;

  }


  if(
    !Number.isFinite(p)
    ||
    p < 1
  ){

    alert(
      "Bitte eine gültige Portionszahl eingeben."
    );

    return;

  }


  const factor =
  p / selected.base;


  resultTitle.textContent =
  selected.name;


  resultMeta.textContent =
  selected.category +
  " · berechnet für " +
  p +
  " Portionen" +
  (
    selected.custom
    ? " · Eigenes Gericht"
    : ""
  );


  ingredientRows.innerHTML =
  "";


  selected.ingredients.forEach(
    ([name,amount,unit]) => {

      const row =
      document.createElement("tr");

      row.innerHTML =
      "<td>" +
      name +
      "</td>" +

      "<td>" +
      formatAmount(
        amount * factor,
        unit
      ) +
      "</td>";

      ingredientRows.appendChild(
        row
      );

    }
  );


  result.style.display =
  "block";


  deleteRecipe.style.display =
  selected.custom
  ? "block"
  : "none";


  result.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}


/* =====================================================
   EIGENES GERICHT – ZUTATENZEILE
===================================================== */

function createIngredientRow(){

  const row =
  document.createElement("div");

  row.className =
  "ingredientRow";


  row.innerHTML = `

    <input
      class="ingredientName"
      type="text"
      placeholder="Zutat"
    >

    <input
      class="ingredientAmount"
      type="number"
      min="0"
      step="0.01"
      placeholder="Menge"
    >

    <select class="ingredientUnit">
      <option value="kg">kg</option>
      <option value="g">g</option>
      <option value="l">l</option>
      <option value="ml">ml</option>
      <option value="Stk">Stk</option>
    </select>

    <button
      type="button"
      class="removeIngredient"
      aria-label="Zutat entfernen"
    >
      ×
    </button>

  `;


  row.querySelector(
    ".removeIngredient"
  )
  .addEventListener(
    "click",
    () => {

      if(
        customIngredients.children.length > 1
      ){

        row.remove();

      }else{

        row.querySelector(
          ".ingredientName"
        ).value = "";

        row.querySelector(
          ".ingredientAmount"
        ).value = "";

      }

    }
  );


  customIngredients.appendChild(
    row
  );

}

/* =====================================================
   EIGENES GERICHT SPEICHERN
===================================================== */

saveRecipe.addEventListener(
  "click",
  () => {

    const name =
    customName.value.trim();

    const base =
    Number(customBase.value);

    const recipeCategory =
    customCategory.value;


    if(!name){

      alert(
        "Bitte einen Namen für das Gericht eingeben."
      );

      return;

    }


    if(
      !Number.isFinite(base)
      ||
      base < 1
    ){

      alert(
        "Bitte eine gültige Grundportion eingeben."
      );

      return;

    }


    const exists =
    allRecipes().some(
      recipe =>
      normalize(recipe.name) ===
      normalize(name)
    );


    if(exists){

      alert(
        "Ein Gericht mit diesem Namen gibt es bereits."
      );

      return;

    }


    const ingredients = [];


    document
    .querySelectorAll(
      "#customIngredients .ingredientRow"
    )
    .forEach(row => {

      const ingredientName =
      row.querySelector(
        ".ingredientName"
      ).value.trim();

      const amount =
      Number(
        row.querySelector(
          ".ingredientAmount"
        ).value
      );

      const unit =
      row.querySelector(
        ".ingredientUnit"
      ).value;


      if(
        ingredientName &&
        Number.isFinite(amount) &&
        amount > 0
      ){

        ingredients.push([
          ingredientName,
          amount,
          unit
        ]);

      }

    });


    if(
      ingredients.length === 0
    ){

      alert(
        "Bitte mindestens eine Zutat mit Menge eingeben."
      );

      return;

    }


    const newRecipe = {

      name:name,

      category:
      recipeCategory,

      base:base,

      ingredients:
      ingredients,

      custom:true,

      id:
      Date.now()

    };


    customRecipes.push(
      newRecipe
    );


    saveCustomRecipes();


    category.value =
    recipeCategory;


    fillDishSelect(
      name
    );


    search.value =
    name;


    portions.value =
    base;


    renderResult();


    saveSuccess.style.display =
    "block";


    customName.value =
    "";

    customBase.value =
    10;


    customIngredients.innerHTML =
    "";

    createIngredientRow();
    createIngredientRow();
    createIngredientRow();


    setTimeout(
      () => {

        saveSuccess.style.display =
        "none";

      },
      3000
    );

  }
);


/* =====================================================
   EIGENES GERICHT LÖSCHEN
===================================================== */

deleteRecipe.addEventListener(
  "click",
  () => {

    const selected =
    customRecipes.find(
      recipe =>
      recipe.name === dish.value
    );


    if(!selected){
      return;
    }


    const confirmDelete =
    confirm(
      'Eigenes Gericht "' +
      selected.name +
      '" wirklich löschen?'
    );


    if(!confirmDelete){
      return;
    }


    customRecipes =
    customRecipes.filter(
      recipe =>
      recipe.id !== selected.id
    );


    saveCustomRecipes();


    search.value =
    "";


    result.style.display =
    "none";


    deleteRecipe.style.display =
    "none";


    fillDishSelect();

  }
);
