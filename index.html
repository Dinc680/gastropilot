<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GastroPilot – Mengenrechner</title>
<!-- Wochenplaner V2 – robuster Start -->

<style>
*{box-sizing:border-box}

:root{
  --green:#135847;
  --green2:#22866f;
  --bg:#f1f3f2;
  --text:#202020;
  --muted:#777;
  --border:#cfcfcf;
  --blue:#59aef0;
  --danger:#b53a3a;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  background:var(--green);
  color:white;
  padding:28px 36px 36px;
}

header h1{
  margin:0;
  font-size:42px;
  font-weight:800;
}

header p{
  margin:14px 0 0;
  font-size:25px;
  font-weight:500;
}

main{
  max-width:900px;
  margin:40px auto;
  padding:0 24px 60px;
}

.card{
  background:white;
  border-radius:38px;
  padding:50px 36px;
  margin-bottom:28px;
}

h2{
  margin:0 0 45px;
  color:var(--green);
  font-size:46px;
}

h3{color:var(--green)}

.field{
  margin-bottom:32px;
  position:relative;
}

label{
  display:block;
  font-size:26px;
  font-weight:800;
  margin-bottom:17px;
}

input,
select{
  width:100%;
  font-size:22px;
  padding:18px 24px;
  border:3px solid var(--border);
  border-radius:25px;
  background:white;
  color:#111;
  outline:none;
  min-height:70px;
}

input:focus,
select:focus{
  border-color:var(--blue);
}

input::placeholder{color:#aaa}

.small{
  font-size:18px;
  color:var(--muted);
  font-weight:600;
  margin-top:12px;
}

.suggestions{
  display:none;
  position:absolute;
  z-index:20;
  left:0;
  right:0;
  top:calc(100% - 2px);
  background:#fff;
  border:2px solid #ddd;
  border-radius:0 0 24px 24px;
  box-shadow:0 14px 30px rgba(0,0,0,.13);
  max-height:330px;
  overflow-y:auto;
}

.suggestion{
  padding:17px 22px;
  border-bottom:1px solid #eee;
  font-size:20px;
  cursor:pointer;
}

.suggestion:last-child{border-bottom:none}

.suggestion:hover,
.suggestion:active{
  background:#f1f7f5;
}

.suggestion .cat{
  display:block;
  color:#777;
  font-size:14px;
  margin-top:3px;
}

.empty{
  padding:18px 22px;
  color:#777;
}

button{
  width:100%;
  border:none;
  border-radius:26px;
  padding:20px 24px;
  background:var(--green2);
  color:white;
  font-size:24px;
  font-weight:800;
  cursor:pointer;
}

button:active{transform:scale(.995)}

.secondary{
  background:white;
  color:var(--green);
  border:3px solid var(--green);
}

.danger{
  background:white;
  color:var(--danger);
  border:3px solid var(--danger);
  margin-top:18px;
}

.result{
  display:none;
  margin-top:32px;
  border-top:2px solid #e7e7e7;
  padding-top:28px;
}

.result h3{
  font-size:28px;
  margin:0 0 8px;
}

.result-meta{
  color:#777;
  font-size:18px;
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:19px;
}

th,
td{
  text-align:left;
  padding:14px 8px;
  border-bottom:1px solid #e6e6e6;
}

th:last-child,
td:last-child{
  text-align:right;
}

#customForm{
  display:none;
  margin-top:30px;
}

.sectionText{
  color:#666;
  font-size:19px;
  line-height:1.5;
  margin:-25px 0 35px;
}

.ingredientRow{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 52px;
  gap:10px;
  margin-bottom:12px;
  align-items:center;
}

.ingredientRow input,
.ingredientRow select{
  min-height:58px;
  padding:12px 15px;
  font-size:17px;
  border-radius:18px;
  border-width:2px;
}

.removeIngredient{
  width:52px;
  height:52px;
  min-height:0;
  padding:0;
  border-radius:50%;
  background:#eee;
  color:#555;
  font-size:28px;
}

.addIngredient{
  margin-top:8px;
  background:white;
  color:var(--green);
  border:3px solid var(--green);
}


/* Rezept per Copy & Paste erkennen */
.recipeImportBox{
  margin:0 0 28px;
  padding:24px;
  border:2px solid #dfe7e4;
  border-radius:24px;
  background:#f7faf9;
}

.recipeImportBox h3{
  margin:0 0 10px;
  font-size:26px;
}

.recipeImportBox p{
  margin:0 0 16px;
  color:#666;
  font-size:17px;
  line-height:1.5;
}

.recipeImportText{
  width:100%;
  min-height:210px;
  resize:vertical;
  font:inherit;
  font-size:18px;
  line-height:1.45;
  padding:18px 20px;
  border:3px solid var(--border);
  border-radius:22px;
  background:white;
  color:#111;
  outline:none;
}

.recipeImportText:focus{border-color:var(--blue)}

.recipeImportActions{
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
  margin-top:14px;
}

.recipeImportClear{
  width:auto;
  min-width:90px;
  background:white;
  color:#666;
  border:2px solid #bbb;
}

.recipeImportStatus{
  display:none;
  margin-top:14px;
  padding:13px 15px;
  border-radius:14px;
  background:#e8f5f0;
  color:var(--green);
  font-size:16px;
  font-weight:700;
}

.saveRecipe{margin-top:28px}

.success{
  display:none;
  background:#e8f5f0;
  color:var(--green);
  padding:18px 20px;
  border-radius:18px;
  margin-top:22px;
  font-size:18px;
  font-weight:700;
}

/* Weitere Zutaten bei vorhandenen Gerichten */

.extraIngredientBox{
  margin-top:28px;
  padding-top:24px;
  border-top:2px solid #e7e7e7;
}

.extraIngredientForm{
  display:none;
  margin-top:20px;
}

.extraIngredientFields{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}

.extraIngredientFields input,
.extraIngredientFields select{
  min-height:58px;
  padding:12px 15px;
  font-size:17px;
  border-radius:18px;
  border-width:2px;
}

.extraBadge{
  display:inline-block;
  margin-left:7px;
  padding:3px 7px;
  border-radius:8px;
  background:#e8f5f0;
  color:var(--green);
  font-size:12px;
  font-weight:700;
}

.amountCell{
  white-space:nowrap;
}

.removeExtra{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:30px;
  height:30px;
  min-height:0;
  padding:0;
  margin-left:10px;
  border-radius:50%;
  background:#eee;
  color:#666;
  font-size:19px;
  vertical-align:middle;
}

/* Einkaufsliste */

.shoppingAdd{
  margin-top:24px;
}

.shoppingNotice{
  display:none;
  margin-top:14px;
  padding:14px 16px;
  border-radius:16px;
  background:#e8f5f0;
  color:var(--green);
  font-size:17px;
  font-weight:800;
}

.shoppingEmpty{
  color:#777;
  font-size:19px;
  line-height:1.5;
}

.shoppingDishList{
  margin-bottom:30px;
}

.shoppingDish{
  display:grid;
  grid-template-columns:1fr auto;
  gap:14px;
  align-items:center;
  padding:16px 0;
  border-bottom:1px solid #e6e6e6;
}

.shoppingDishName{
  font-size:19px;
  font-weight:800;
}

.shoppingDishMeta{
  color:#777;
  margin-top:4px;
  font-size:16px;
}

.removeShoppingDish{
  width:42px;
  height:42px;
  min-height:0;
  padding:0;
  border-radius:50%;
  background:#eee;
  color:#666;
  font-size:25px;
}

.shoppingTableWrap{
  overflow-x:auto;
}

.shoppingActions{
  margin-top:26px;
}

.shoppingCount{
  color:#777;
  font-size:18px;
  font-weight:700;
  margin:-25px 0 24px;
}



/* Wochenplaner */
.weekPlannerIntro{
  color:#666;
  font-size:19px;
  line-height:1.5;
  margin:-25px 0 28px;
}

.weekDay{
  margin-bottom:24px;
  padding:22px;
  border:2px solid #e3e8e5;
  border-radius:24px;
  background:#fafcfb;
}

.weekDay h3{
  margin:0 0 16px;
  font-size:24px;
}

.weekMealRow{
  display:grid;
  grid-template-columns:150px 1fr 130px;
  gap:12px;
  margin-bottom:12px;
  align-items:center;
}

.weekMealLabel{
  font-size:16px;
  font-weight:800;
  color:var(--green);
}

.weekMealRow select,
.weekMealRow input{
  min-height:58px;
  padding:12px 15px;
  font-size:17px;
  border-radius:18px;
  border-width:2px;
}

.weekSummary{
  margin-top:28px;
  padding:24px;
  border-radius:24px;
  background:#f6f8f7;
  border:2px solid #e1e7e4;
}

.weekSummaryGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px 22px;
}

.we
