<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GastroPilot – Mengenrechner</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --green: #135847;
  --green2: #22866f;
  --bg: #f1f3f2;
  --text: #202020;
  --muted: #7b7b7b;
  --border: #cfcfcf;
  --blue: #59aef0;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

header {
  background: var(--green);
  color: white;
  padding: 28px 36px 36px;
}

header h1 {
  margin: 0;
  font-size: 42px;
  font-weight: 800;
}

header p {
  margin: 14px 0 0;
  font-size: 25px;
  font-weight: 500;
}

main {
  max-width: 900px;
  margin: 40px auto;
  padding: 0 24px 60px;
}

.card {
  background: white;
  border-radius: 38px;
  padding: 50px 36px;
}

h2 {
  margin: 0 0 52px;
  color: var(--green);
  font-size: 46px;
}

.field {
  margin-bottom: 32px;
  position: relative;
}

label {
  display: block;
  font-size: 26px;
  font-weight: 800;
  margin-bottom: 17px;
}

input,
select {
  width: 100%;
  font-size: 24px;
  padding: 20px 26px;
  border: 4px solid var(--border);
  border-radius: 28px;
  background: white;
  color: #111;
  outline: none;
  min-height: 78px;
}

input:focus,
select:focus {
  border-color: var(--blue);
}

input::placeholder {
  color: #aaa;
}

.small {
  font-size: 20px;
  color: var(--muted);
  font-weight: 600;
  margin-top: 13px;
}

/* Suchvorschläge */

.suggestions {
  display: none;
  position: absolute;
  z-index: 20;
  left: 0;
  right: 0;
  top: calc(100% - 2px);
  background: #fff;
  border: 2px solid #ddd;
  border-radius: 0 0 24px 24px;
  box-shadow: 0 14px 30px rgba(0,0,0,.13);
  max-height: 330px;
  overflow-y: auto;
}

.suggestion {
  padding: 17px 22px;
  border-bottom: 1px solid #eee;
  font-size: 20px;
  cursor: pointer;
}

.suggestion:last-child {
  border-bottom: none;
}

.suggestion:hover,
.suggestion:active {
  background: #f1f7f5;
}

.suggestion .cat {
  display: block;
  color: #777;
  font-size: 14px;
  margin-top: 3px;
}

.empty {
  padding: 18px 22px;
  color: #777;
  font-size: 18px;
}

button {
  width: 100%;
  border: none;
  border-radius: 28px;
  padding: 22px 24px;
  background: var(--green2);
  color: white;
  font-size: 26px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 8px;
}

.result {
  display: none;
  margin-top: 32px;
  border-top: 2px solid #e7e7e7;
  padding-top: 28px;
}

.result h3 {
  font-size: 28px;
  margin: 0 0 8px;
  color: var(--green);
}

.result-meta {
  color: #777;
  font-size: 18px;
  margin-bottom: 20px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 19px;
}

th,
td {
  text-align: left;
  padding: 14px 8px;
  border-bottom: 1px solid #e6e6e6;
}

th:last-child,
td:last-child {
  text-align: right;
}

@media(max-width:600px) {

  header {
    padding: 24px 36px 30px;
  }

  header h1 {
    font-size: 34px;
  }

  header p {
    font-size: 20px;
  }

  main {
    margin: 28px auto;
    padding: 0 23px 40px;
  }

  .card {
    border-radius: 34px;
    padding: 42px 36px;
  }

  h2 {
    font-size: 39px;
    margin-bottom: 48px;
  }

  label {
    font-size: 23px;
  }

  input,
  select {
    font-size: 21px;
    min-height: 68px;
    padding: 16px 22px;
    border-width: 3px;
    border-radius: 24px;
  }

  button {
    font-size: 23px;
    padding: 19px;
  }
}
</style>
</head>

<header>
  <h1>GastroPilot</h1>
  <p>Dein digitaler Küchenassistent</p>
</header>

<main>

<section class="card">

<h2>Mengenrechner</h2>

<div class="field" id="searchField">

<label for="search">Gericht suchen</label>

<input
  id="search"
  type="text"
  autocomplete="off"
  placeholder="z. B. Lachs, Curry, Pasta …"
>

<div id="suggestions" class="suggestions"></div>

</div>


<div class="field">

<label for="category">Kategorie</label>

<select id="category">

<option value="Alle Gerichte">Alle Gerichte</option>
<option value="Fleisch">Fleisch</option>
<option value="Fisch">Fisch</option>
<option value="Vegetarisch">Vegetarisch</option>
<option value="Vegan">Vegan</option>
<option value="Pasta">Pasta</option>

</select>

</div>


<div class="field">

<label for="dish">Gericht auswählen</label>

<select id="dish"></select>

<div class="small" id="count"></div>

</div>


<div class="field">

<label for="portions">Anzahl Portionen</label>

<input
  id="portions"
  type="number"
  inputmode="numeric"
  min="1"
  max="10000"
  value="10"
>

</div>


<button id="calculate">
Mengen berechnen
</button>


<div id="result" class="result">

<h3 id="resultTitle"></h3>

<div id="resultMeta" class="result-meta"></div>

<table>

<thead>
<tr>
<th>Zutat</th>
<th>Menge</th>
</tr>
</thead>

<tbody id="ingredientRows"></tbody>

</table>

</div>

</section>

</main>

["Knoblauch",60,"g"],
["Chili",10,"g"],
["Petersilie",40,"g"],
["Parmesan",0.25,"kg"]
]}

];


/* =====================================================
   PROGRAMM
===================================================== */

const search =
document.getElementById("search");

const suggestions =
document.getElementById("suggestions");

const category =
document.getElementById("category");

const dish =
document.getElementById("dish");

const count =
document.getElementById("count");

const portions =
document.getElementById("portions");

const calculate =
document.getElementById("calculate");

const result =
document.getElementById("result");

const resultTitle =
document.getElementById("resultTitle");

const resultMeta =
document.getElementById("resultMeta");

const ingredientRows =
document.getElementById("ingredientRows");


function normalize(text) {

return text
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"");

}


function categoryRecipes() {

if(category.value === "Alle Gerichte") {
return recipes;
}

return recipes.filter(
recipe => recipe.category === category.value
);

}


function fillDishSelect(selectedName = "") {

const list = categoryRecipes();

dish.innerHTML =
'<option value="">Bitte Gericht auswählen</option>';

list.forEach(recipe => {

const option =
document.createElement("option");

option.value = recipe.name;
option.textContent = recipe.name;

dish.appendChild(option);

});

count.textContent =
list.length + (list.length === 1
? " Gericht"
: " Gerichte");

if(
selectedName &&
list.some(recipe => recipe.name === selectedName)
) {
dish.value = selectedName;
}

}


function showSuggestions() {

const query =
normalize(search.value.trim());

if(!query) {

suggestions.style.display = "none";
suggestions.innerHTML = "";

return;

}

const pool = categoryRecipes();

const matches = pool.filter(recipe =>

normalize(recipe.name).includes(query) ||
normalize(recipe.category).includes(query)

).slice(0,12);


suggestions.innerHTML = "";


if(matches.length === 0) {

suggestions.innerHTML =
'<div class="empty">Kein passendes Gericht gefunden</div>';

}

else {

matches.forEach(recipe => {

const element =
document.createElement("div");

element.className = "suggestion";

element.innerHTML =
"<strong>" +
recipe.name +
"</strong>" +
'<span class="cat">' +
recipe.category +
"</span>";

element.addEventListener(
"click",
() => chooseRecipe(recipe)
);

suggestions.appendChild(element);

});

}

suggestions.style.display = "block";

}


function chooseRecipe(recipe) {

dish.value = recipe.name;

search.value = recipe.name;

suggestions.style.display = "none";

renderResult();

}


function formatAmount(value,unit) {

if(unit === "Stk") {

const rounded =
Math.round(value * 10) / 10;

return (
Number.isInteger(rounded)
? rounded.toFixed(0)
: rounded.toFixed(1)
) + " Stk";

}


if(unit === "kg") {

if(value < 1) {
return Math.round(value * 1000) + " g";
}

return value.toLocaleString(
"de-DE",
{
minimumFractionDigits: value < 10 ? 2 : 1,
maximumFractionDigits: 2
}
) + " kg";

}


if(unit === "l") {

if(value < 1) {
return Math.round(value * 1000) + " ml";
}

return value.toLocaleString(
"de-DE",
{
minimumFractionDigits: value < 10 ? 2 : 1,
maximumFractionDigits: 2
}
) + " l";

}


if(unit === "g") {

if(value >= 1000) {

return (
value / 1000
).toLocaleString(
"de-DE",
{maximumFractionDigits:2}
) + " kg";

}

return Math.round(value) + " g";

}

return value + " " + unit;

}


function renderResult() {

const selected =
recipes.find(
recipe => recipe.name === dish.value
);

const p =
Number(portions.value);


if(!selected) {

alert(
"Bitte zuerst ein Gericht auswählen."
);

return;

}


if(!Number.isFinite(p) || p < 1) {

alert(
"Bitte eine gültige Portionszahl eingeben."
);

return;

}


const factor =
p / selected.base;


resultTitle.textContent =
selected.name;


resultMeta.textContent =
selected.category +
" · berechnet für " +
p +
" Portionen";


ingredientRows.innerHTML = "";


selected.ingredients.forEach(
([name,amount,unit]) => {

const row =
document.createElement("tr");

row.innerHTML =
"<td>" +
name +
"</td>" +
"<td>" +
formatAmount(
amount * factor,
unit
) +
"</td>";

ingredientRows.appendChild(row);

});


result.style.display = "block";


result.scrollIntoView({
behavior:"smooth",
block:"start"
});

}


/* Kategorie wechseln */

category.addEventListener(
"change",
() => {

fillDishSelect();

result.style.display = "none";

if(search.value.trim()) {
showSuggestions();
}

});


/* Sofortsuche beim Tippen */

search.addEventListener(
"input",
showSuggestions
);


search.addEventListener(
"focus",
() => {

if(search.value.trim()) {
showSuggestions();
}

});


/* Gericht aus Dropdown */

dish.addEventListener(
"change",
() => {

if(dish.value) {

search.value = dish.value;

renderResult();

}

});


/* Berechnen */

calculate.addEventListener(
"click",
renderResult
);


/* Enter */

portions.addEventListener(
"keydown",
event => {

if(event.key === "Enter") {
renderResult();
}

});


/* Suchfenster schließen */

document.addEventListener(
"click",
event => {

if(
!document
.getElementById("searchField")
.contains(event.target)
) {

suggestions.style.display = "none";

}

});


/* Start */

fillDishSelect();

</script>

</body>
</html>
