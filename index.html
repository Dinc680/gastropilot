<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GastroPilot – Mengenrechner</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f5;
      color: #222;
      line-height: 1.5;
    }

    header {
      background: #153f35;
      color: white;
      padding: 24px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 5px;
    }

    header p {
      color: #d6e4df;
    }

    .container {
      width: 100%;
      max-width: 950px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    h2 {
      color: #153f35;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    select,
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #1f705d;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #175747;
    }

    .status {
      margin-top: 12px;
      color: #666;
      font-size: 14px;
    }

    #ergebnis {
      display: none;
    }

    .gericht-titel {
      font-size: 24px;
      color: #153f35;
      margin-bottom: 5px;
    }

    .portionen {
      color: #666;
      margin-bottom: 20px;
    }

    .kategorie-anzeige {
      display: inline-block;
      margin-bottom: 15px;
      padding: 5px 10px;
      border-radius: 20px;
      background: #eef4f1;
      color: #153f35;
      font-size: 14px;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th,
    td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #eef4f1;
      color: #153f35;
    }

    .hinweis {
      background: #eef4f1;
      border-left: 4px solid #1f705d;
      padding: 12px;
      margin-top: 20px;
      border-radius: 6px;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 25px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 26px;
      }

      .card {
        padding: 18px;
      }

      th,
      td {
        padding: 9px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>GastroPilot</h1>
    <p>Dein digitaler Küchenassistent</p>
  </header>

  <main class="container">

    <section class="card">

      <h2>Mengenrechner</h2>

      <label for="suche">Gericht suchen</label>
      <input
        type="text"
        id="suche"
        placeholder="z. B. Schnitzel, Curry, Pasta..."
      >

      <label for="kategorie">Kategorie auswählen</label>
      <select id="kategorie">
        <option value="alle">Alle Kategorien</option>
        <option value="Fleisch">Fleisch</option>
        <option value="Fisch">Fisch</option>
        <option value="Vegetarisch">Vegetarisch</option>
        <option value="Vegan">Vegan</option>
        <option value="Pasta & Aufläufe">Pasta & Aufläufe</option>
      </select>

      <label for="gericht">Gericht auswählen</label>
      <select id="gericht">
        <option value="">Bitte Gericht auswählen</option>
      </select>

      <div class="status" id="statusText"></div>

      <label for="personen">Anzahl Portionen</label>
      <input
        type="number"
        id="personen"
        min="1"
        max="2000"
        value="10"
      >

      <button id="berechnenButton">
        Mengen berechnen
      </button>

    </section>


    <section class="card" id="ergebnis">

      <div class="kategorie-anzeige" id="kategorieAnzeige"></div>

      <div class="gericht-titel" id="gerichtTitel"></div>

      <div class="portionen" id="portionText"></div>

      <table>
        <thead>
          <tr>
            <th>Zutat</th>
            <th>Menge</th>
          </tr>
        </thead>

        <tbody id="zutatenListe"></tbody>
      </table>

      <div class="hinweis">
        Die Mengen werden automatisch auf die gewünschte Portionszahl hochgerechnet.
      </div>

    </section>

  </main>

  <footer>
    GastroPilot © 2026
  </footer>

        name: "Penne Arrabbiata",
        kategorie: "Pasta & Aufläufe",
        basis: 10,
        zutaten: [
          ["Penne", 1.0, "kg"],
          ["Tomaten", 1.2, "kg"],
          ["Tomatensauce", 0.8, "l"],
          ["Zwiebeln", 0.25, "kg"]
        ]
      },

      cannelloni: {
        name: "Cannelloni mit Spinat und Ricotta",
        kategorie: "Pasta & Aufläufe",
        basis: 10,
        zutaten: [
          ["Cannelloni", 1.0, "kg"],
          ["Spinat", 1.0, "kg"],
          ["Ricotta", 0.8, "kg"],
          ["Tomatensauce", 1.0, "l"],
          ["Käse", 0.4, "kg"]
        ]
      },

      nudelauflauf: {
        name: "Nudelauflauf mit Gemüse",
        kategorie: "Pasta & Aufläufe",
        basis: 10,
        zutaten: [
          ["Nudeln", 1.0, "kg"],
          ["Gemüse", 1.2, "kg"],
          ["Sahne", 0.7, "l"],
          ["Käse", 0.5, "kg"]
        ]
      }

    };


    const suche = document.getElementById("suche");
    const kategorie = document.getElementById("kategorie");
    const gerichtAuswahl = document.getElementById("gericht");
    const personenEingabe = document.getElementById("personen");
    const berechnenButton = document.getElementById("berechnenButton");

    const statusText = document.getElementById("statusText");

    const ergebnis = document.getElementById("ergebnis");
    const gerichtTitel = document.getElementById("gerichtTitel");
    const portionText = document.getElementById("portionText");
    const zutatenListe = document.getElementById("zutatenListe");
    const kategorieAnzeige = document.getElementById("kategorieAnzeige");


    suche.addEventListener("input", gerichteFiltern);
    kategorie.addEventListener("change", gerichteFiltern);
    berechnenButton.addEventListener("click", berechnen);


    function gerichteFiltern() {

      const suchText = suche.value.toLowerCase().trim();
      const gewaehlteKategorie = kategorie.value;

      gerichtAuswahl.innerHTML =
        '<option value="">Bitte Gericht auswählen</option>';

      let anzahl = 0;

      Object.keys(rezepte)
        .sort(function(a, b) {
          return rezepte[a].name.localeCompare(rezepte[b].name);
        })
        .forEach(function(key) {

          const rezept = rezepte[key];

          const passtZurSuche =
            rezept.name.toLowerCase().includes(suchText);

          const passtZurKategorie =
            gewaehlteKategorie === "alle" ||
            rezept.kategorie === gewaehlteKategorie;

          if (passtZurSuche && passtZurKategorie) {

            const option = document.createElement("option");

            option.value = key;
            option.textContent =
              rezept.name + " – " + rezept.kategorie;

            gerichtAuswahl.appendChild(option);

            anzahl++;
          }

        });


      if (anzahl === 1) {
        statusText.textContent = "1 Gericht gefunden.";
      } else {
        statusText.textContent =
          anzahl + " Gerichte gefunden.";
      }

    }


    function berechnen() {

      const gerichtKey = gerichtAuswahl.value;
      const personen = Number(personenEingabe.value);

      if (!gerichtKey) {
        alert("Bitte zuerst ein Gericht auswählen.");
        return;
      }

      if (!personen || personen < 1) {
        alert("Bitte eine gültige Portionszahl eingeben.");
        return;
      }

      const rezept = rezepte[gerichtKey];

      if (!rezept) {
        alert("Das ausgewählte Rezept wurde nicht gefunden.");
        return;
      }

      const faktor = personen / rezept.basis;

      kategorieAnzeige.textContent = rezept.kategorie;
      gerichtTitel.textContent = rezept.name;

      portionText.textContent =
        "Berechnung für " + personen + " Portionen";

      zutatenListe.innerHTML = "";


      rezept.zutaten.forEach(function(zutat) {

        const name = zutat[0];
        const basisMenge = zutat[1];
        const einheit = zutat[2];

        const neueMenge = basisMenge * faktor;

        const zeile = document.createElement("tr");

        const nameFeld = document.createElement("td");
        nameFeld.textContent = name;

        const mengenFeld = document.createElement("td");
        mengenFeld.textContent =
          formatMenge(neueMenge) + " " + einheit;

        zeile.appendChild(nameFeld);
        zeile.appendChild(mengenFeld);

        zutatenListe.appendChild(zeile);

      });


      ergebnis.style.display = "block";

      ergebnis.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }


    function formatMenge(menge) {

      if (Number.isInteger(menge)) {
        return menge.toString();
      }

      return menge
        .toFixed(2)
        .replace(".", ",")
        .replace(/,00$/, "")
        .replace(/0$/, "");

    }


    gerichteFiltern();

  </script>

</body>
</html>
