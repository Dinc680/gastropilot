<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GastroPilot – Mengenrechner</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f5;
      color: #222;
      line-height: 1.5;
    }

    header {
      background: #153f35;
      color: white;
      padding: 24px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 5px;
    }

    header p {
      color: #d6e4df;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    h2 {
      color: #153f35;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    select,
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #1f705d;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #175747;
    }

    #ergebnis {
      display: none;
    }

    .gericht-titel {
      font-size: 24px;
      color: #153f35;
      margin-bottom: 5px;
    }

    .portionen {
      color: #666;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th,
    td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #eef4f1;
      color: #153f35;
    }

    .hinweis {
      background: #eef4f1;
      border-left: 4px solid #1f705d;
      padding: 12px;
      margin-top: 20px;
      border-radius: 6px;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 25px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 26px;
      }

      .card {
        padding: 18px;
      }

      th,
      td {
        padding: 9px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>GastroPilot</h1>
    <p>Dein digitaler Küchenassistent</p>
  </header>

  <main class="container">

    <section class="card">

      <h2>Mengenrechner</h2>

      <label for="gericht">Gericht auswählen</label>

      <select id="gericht">
        <option value="">Bitte Gericht auswählen</option>

        <optgroup label="Fleischgerichte">
          <option value="zuericher">Züricher Geschnetzeltes</option>
          <option value="cordonbleu">Cordon Bleu mit Pommes</option>
          <option value="gulasch">Rindergulasch mit Spätzle</option>
          <option value="haehnchencurry">Hähnchen-Curry mit Reis</option>
          <option value="frikadellen">Frikadellen mit Kartoffelpüree</option>
          <option value="putengeschnetzeltes">Putengeschnetzeltes mit Reis</option>
          <option value="bolognese">Spaghetti Bolognese</option>
          <option value="schnitzel">Schnitzel mit Kartoffeln</option>
        </optgroup>

        <optgroup label="Vegetarische Gerichte">
          <option value="masala">Kichererbsen Masala</option>
          <option value="gemuesecurry">Gemüsecurry mit Reis</option>
          <option value="linsenbolognese">Spaghetti mit Linsenbolognese</option>
          <option value="kaesespaetzle">Käsespätzle</option>
          <option value="gemueselasagne">Gemüselasagne</option>
          <option value="chili">Vegetarisches Chili</option>
          <option value="nudelgemuese">Nudel-Gemüse-Pfanne</option>
          <option value="kartoffelgratin">Kartoffelgratin mit Gemüse</option>
        </optgroup>

      </select>

      <label for="personen">Anzahl Portionen</label>

      <input
        type="number"
        id="personen"
        min="1"
        max="1000"
        value="10"
      >

      <button id="berechnenButton">
        Mengen berechnen
      </button>

    </section>


    <section class="card" id="ergebnis">

      <div class="gericht-titel" id="gerichtTitel"></div>

      <div class="portionen" id="portionText"></div>

      <table>
        <thead>
          <tr>
            <th>Zutat</th>
            <th>Menge</th>
          </tr>
        </thead>

        <tbody id="zutatenListe"></tbody>
      </table>

      <div class="hinweis">
        Die Mengen werden automatisch auf die gewünschte Portionszahl hochgerechnet.
      </div>

    </section>

  </main>


  <footer>
    GastroPilot © 2026
  </footer>


  <script>

    const rezepte = {

      zuericher: {
        name: "Züricher Geschnetzeltes",
        basis: 10,
        zutaten: [
          ["Schweinegeschnetzeltes", 1.5, "kg"],
          ["Champignons", 0.6, "kg"],
          ["Zwiebeln", 0.3, "kg"],
          ["Sahne", 0.5, "l"],
          ["Brühe", 0.5, "l"],
          ["Rösti", 1.8, "kg"]
        ]
      },

      cordonbleu: {
        name: "Cordon Bleu mit Pommes",
        basis: 10,
        zutaten: [
          ["Cordon Bleu", 10, "Stück"],
          ["Pommes frites", 2.0, "kg"],
          ["Kopfsalat", 0.5, "kg"],
          ["Joghurt-Dressing", 0.3, "l"]
        ]
      },

      gulasch: {
        name: "Rindergulasch mit Spätzle",
        basis: 10,
        zutaten: [
          ["Rindergulasch", 1.6, "kg"],
          ["Zwiebeln", 0.5, "kg"],
          ["Paprika", 0.4, "kg"],
          ["Brühe", 0.8, "l"],
          ["Tomatenmark", 0.15, "kg"],
          ["Spätzle", 1.5, "kg"]
        ]
      },

      haehnchencurry: {
        name: "Hähnchen-Curry mit Reis",
        basis: 10,
        zutaten: [
          ["Hähnchenbrust", 1.5, "kg"],
          ["Gemüse", 0.8, "kg"],
          ["Kokosmilch", 0.8, "l"],
          ["Currysauce", 0.5, "l"],
          ["Reis", 0.8, "kg"]
        ]
      },

      frikadellen: {
        name: "Frikadellen mit Kartoffelpüree",
        basis: 10,
        zutaten: [
          ["Hackfleisch", 1.4, "kg"],
          ["Zwiebeln", 0.25, "kg"],
          ["Ei", 3, "Stück"],
          ["Paniermehl", 0.15, "kg"],
          ["Kartoffeln", 2.0, "kg"],
          ["Milch", 0.5, "l"]
        ]
      },

      putengeschnetzeltes: {
        name: "Putengeschnetzeltes mit Reis",
        basis: 10,
        zutaten: [
          ["Putenbrust", 1.5, "kg"],
          ["Paprika", 0.5, "kg"],
          ["Zwiebeln", 0.3, "kg"],
          ["Sahne", 0.5, "l"],
          ["Brühe", 0.5, "l"],
          ["Reis", 0.8, "kg"]
        ]
      },

      bolognese: {
        name: "Spaghetti Bolognese",
        basis: 10,
        zutaten: [
          ["Rinderhackfleisch", 1.2, "kg"],
          ["Spaghetti", 1.0, "kg"],
          ["Tomaten", 1.2, "kg"],
          ["Zwiebeln", 0.25, "kg"],
          ["Karotten", 0.25, "kg"],
          ["Tomatenmark", 0.15, "kg"]
        ]
      },

      schnitzel: {
        name: "Schnitzel mit Kartoffeln",
        basis: 10,
        zutaten: [
          ["Schweineschnitzel", 10, "Stück"],
          ["Kartoffeln", 2.0, "kg"],
          ["Paniermehl", 0.4, "kg"],
          ["Ei", 4, "Stück"],
          ["Salat", 0.5, "kg"]
        ]
      },

      masala: {
        name: "Kichererbsen Masala",
        basis: 10,
        zutaten: [
          ["Kichererbsen", 1.2, "kg"],
          ["Tomaten", 0.8, "kg"],
          ["Zwiebeln", 0.3, "kg"],
          ["Kokosmilch", 0.8, "l"],
          ["Reis", 0.8, "kg"],
          ["Currypaste", 0.1, "kg"]
        ]
      },

      gemuesecurry: {
        name: "Gemüsecurry mit Reis",
        basis: 10,
        zutaten: [
          ["Gemüsemischung", 1.5, "kg"],
          ["Kokosmilch", 0.8, "l"],
          ["Currysauce", 0.5, "l"],
          ["Reis", 0.8, "kg"]
        ]
      },

      linsenbolognese: {
        name: "Spaghetti mit Linsenbolognese",
        basis: 10,
        zutaten: [
          ["Linsen", 0.7, "kg"],
          ["Spaghetti", 1.0, "kg"],
          ["Tomaten", 1.2, "kg"],
          ["Karotten", 0.3, "kg"],
          ["Zwiebeln", 0.25, "kg"]
        ]
      },

      kaesespaetzle: {
        name: "Käsespätzle",
        basis: 10,
        zutaten: [
          ["Spätzle", 1.5, "kg"],
          ["Käse", 0.7, "kg"],
          ["Zwiebeln", 0.4, "kg"],
          ["Sahne", 0.4, "l"]
        ]
      },

      gemueselasagne: {
        name: "Gemüselasagne",
        basis: 10,
        zutaten: [
          ["Lasagneplatten", 0.7, "kg"],
          ["Gemüse", 1.3, "kg"],
          ["Tomatensauce", 1.0, "l"],
          ["Béchamelsauce", 0.8, "l"],
          ["Käse", 0.5, "kg"]
        ]
      },

      chili: {
        name: "Vegetarisches Chili",
        basis: 10,
        zutaten: [
          ["Kidneybohnen", 0.8, "kg"],
          ["Mais", 0.5, "kg"],
          ["Paprika", 0.6, "kg"],
          ["Tomaten", 1.0, "kg"],
          ["Zwiebeln", 0.3, "kg"],
          ["Reis", 0.8, "kg"]
        ]
      },

      nudelgemuese: {
        name: "Nudel-Gemüse-Pfanne",
        basis: 10,
        zutaten: [
          ["Nudeln", 1.0, "kg"],
          ["Gemüse", 1.2, "kg"],
          ["Sahne", 0.5, "l"],
          ["Käse", 0.3, "kg"]
        ]
      },

      kartoffelgratin: {
        name: "Kartoffelgratin mit Gemüse",
        basis: 10,
        zutaten: [
          ["Kartoffeln", 2.0, "kg"],
          ["Gemüse", 1.0, "kg"],
          ["Sahne", 0.8, "l"],
          ["Käse", 0.5, "kg"]
        ]
      }

    };


    const gerichtAuswahl = document.getElementById("gericht");
    const personenEingabe = document.getElementById("personen");
    const berechnenButton = document.getElementById("berechnenButton");

    const ergebnis = document.getElementById("ergebnis");
    const gerichtTitel = document.getElementById("gerichtTitel");
    const portionText = document.getElementById("portionText");
    const zutatenListe = document.getElementById("zutatenListe");


    berechnenButton.addEventListener("click", berechnen);


    function berechnen() {

      const gerichtKey = gerichtAuswahl.value;
      const personen = Number(personenEingabe.value);

      if (!gerichtKey) {
        alert("Bitte zuerst ein Gericht auswählen.");
        return;
      }

      if (!personen || personen < 1) {
        alert("Bitte eine gültige Portionszahl eingeben.");
        return;
      }

      const rezept = rezepte[gerichtKey];

      if (!rezept) {
        alert("Das ausgewählte Rezept wurde nicht gefunden.");
        return;
      }

      const faktor = personen / rezept.basis;

      gerichtTitel.textContent = rezept.name;

      portionText.textContent =
        "Berechnung für " + personen + " Portionen";

      zutatenListe.innerHTML = "";


      rezept.zutaten.forEach(function(zutat) {

        const name = zutat[0];
        const basisMenge = zutat[1];
        const einheit = zutat[2];

        const neueMenge = basisMenge * faktor;

        const zeile = document.createElement("tr");

        const nameFeld = document.createElement("td");
        nameFeld.textContent = name;

        const mengenFeld = document.createElement("td");
        mengenFeld.textContent =
          formatMenge(neueMenge) + " " + einheit;

        zeile.appendChild(nameFeld);
        zeile.appendChild(mengenFeld);

        zutatenListe.appendChild(zeile);

      });


      ergebnis.style.display = "block";

      ergebnis.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }


    function formatMenge(menge) {

      if (Number.isInteger(menge)) {
        return menge.toString();
      }

      return menge
        .toFixed(2)
        .replace(".", ",")
        .replace(/,00$/, "")
        .replace(/0$/, "");

    }

  </script>

</body>
</html>
